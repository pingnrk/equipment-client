<ng-container *ngIf="isPublicRoute">
  <router-outlet></router-outlet>
</ng-container>

<ng-container *ngIf="!isPublicRoute">
  <dx-drawer [opened]="isDrawerOpen" [position]="'left'" [openedStateMode]="'shrink'" [revealMode]="'slide'"
    template="menuTemplate" height="100vh" [closeOnOutsideClick]="false">

    <div *dxTemplate="let data of 'menuTemplate'" class="app-sidebar">
      <div class="sidebar-header">
        <h5 class="m-0 fw-bold text-primary">EQ System</h5>
      </div>

      <div class="sidebar-nav">
        <a *ngFor="let item of menuItems"
           [routerLink]="item.path"
           routerLinkActive="active"
           class="nav-item">
          <i [class]="'dx-icon-' + item.icon + ' nav-icon'"></i>
          <span class="nav-text">{{ item.text }}</span>
        </a>
      </div>
    </div>

    <div class="app-main-layout">

      <nav class="app-navbar">
        <div class="d-flex align-items-center w-100">
          <button class="btn-menu" (click)="toggleDrawer()">
            <i class="dx-icon-menu"></i>
          </button>
          <h4 class="page-title">ระบบยืมครุภัณฑ์ (Equipment Client)</h4>

          <div class="ms-auto d-flex align-items-center gap-3">
            <ng-container *ngIf="isLoggedIn; else loginBtn">
              <div class="user-badge">
                <div class="avatar">
                  <i class="dx-icon-user"></i>
                </div>
                <span class="user-name">{{ userName }}</span>
              </div>

              <button class="btn-logout" (click)="logout()" title="Logout">
                <i class="dx-icon-runner"></i>
              </button>
            </ng-container>

            <ng-template #loginBtn>
              <button class="btn btn-primary rounded-pill px-4 shadow-sm" (click)="goToLogin()">
                <i class="dx-icon-key me-2"></i> Login
              </button>
            </ng-template>
          </div>
        </div>
      </nav>

      <main class="app-content">
        <div class="content-container">
          <router-outlet></router-outlet>
        </div>
      </main>

    </div>
  </dx-drawer>
</ng-container>

<dx-load-panel shadingColor="rgba(0,0,0,0.4)" [(visible)]="isLoading" [showIndicator]="true" [showPane]="true"
  [shading]="true" message="Loading..."></dx-load-panel>

<dx-toast [(visible)]="toastVisible" [message]="toastMessage" [type]="toastType" [displayTime]="3000"
  position="bottom center" (onHidden)="onToastHidden()"></dx-toast>
