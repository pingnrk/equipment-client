<dx-drawer
  [opened]="isDrawerOpen"
  [position]="'left'"
  [openedStateMode]="'shrink'"
  [revealMode]="'slide'"
  template="menuTemplate"
  height="100vh"
  [closeOnOutsideClick]="false" 
>
  <div *dxTemplate="let data of 'menuTemplate'" class="h-100 bg-white border-end" style="width: 280px;">
    
    <div class="sidebar-header d-flex align-items-center justify-content-center py-3 border-bottom">
        <h4 class="m-0 text-primary fw-bold">
            <i class="dx-icon-box me-2"></i>Inventory
        </h4>
    </div>

    <div class="list-group list-group-flush mt-3 px-3">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="list-group-item list-group-item-action border-0 rounded-3 mb-1"
         (click)="onItemClick(item)" 
      >
        <i [class]="'dx-icon-' + item.icon + ' me-3'"></i>
        <span>{{ item.text }}</span>
      </a>
    </div>
  </div>

  <div class="d-flex flex-column h-100" style="background-color: #f8f9fa;">
     <nav class="navbar navbar-expand navbar-light bg-white shadow-sm px-4" style="height: 64px; z-index: 10;">
        <div class="d-flex align-items-center w-100">
            <button class="btn btn-light border-0 me-3" (click)="toggleDrawer()">
                <i class="dx-icon-menu fs-4 text-secondary"></i>
            </button>
            <h5 class="m-0 text-dark fw-bold">{{ title }}</h5>
            
            <div class="ms-auto d-flex align-items-center">
                <ng-container *ngIf="isLoggedIn; else loginBtn">
                    <div class="d-flex align-items-center me-3 border-end pe-3">
                        <div class="bg-light text-primary rounded-circle d-flex align-items-center justify-content-center me-2 border" style="width: 32px; height: 32px;">
                            <i class="dx-icon-user"></i>
                        </div>
                        <span class="fw-bold text-dark small">{{ userName }}</span>
                    </div>
                    <button class="btn btn-outline-danger btn-sm" (click)="logout()">
                        <i class="dx-icon-runner me-1"></i> Logout
                    </button>
                </ng-container>
                <ng-template #loginBtn>
                    <button class="btn btn-primary btn-sm" (click)="goToLogin()">
                        <i class="dx-icon-key me-1"></i> Login
                    </button>
                </ng-template>
            </div>
        </div>
    </nav>

    <div class="flex-grow-1 overflow-auto p-4">
        <div class="content-wrapper">
             <router-outlet></router-outlet>
        </div>
    </div>

    <footer class="bg-white text-center py-3 border-top mt-auto">
        <div class="container text-muted small">
            <span>&copy; 2026 Equipment Management System.</span>
        </div>
    </footer>
  </div>
</dx-drawer>
