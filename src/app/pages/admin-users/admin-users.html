<div class="page-container">
  <div class="page-header-row">
    <h2 class="page-title">👥 User Management</h2>
  </div>

  <dx-data-grid
    [dataSource]="users"
    [showBorders]="true"
    [rowAlternationEnabled]="true"
    [columnAutoWidth]="true"
    keyExpr="id"
    (onRowInserting)="onRowInserting($event)"
    (onRowUpdating)="onRowUpdating($event)"
    (onRowRemoving)="onRowRemoving($event)">

    <dxo-search-panel [visible]="true"></dxo-search-panel>
    <dxo-paging [pageSize]="10"></dxo-paging>

    <dxo-editing
      mode="popup"
      [allowUpdating]="true"
      [allowDeleting]="true"
      [allowAdding]="true">
      
      <dxo-popup title="จัดการผู้ใช้งาน" [showTitle]="true" [width]="600" [height]="550"></dxo-popup>
      
      <dxo-form>
        <dxi-item itemType="group" caption="ข้อมูลทั่วไป" [colCount]="1">
          <dxi-item dataField="employeeId"></dxi-item>
          <dxi-item dataField="fullName"></dxi-item>
          <dxi-item dataField="email"></dxi-item>
          
          <dxi-item dataField="role"
            editorType="dxSelectBox"
            [editorOptions]="{ items: roles, placeholder: 'เลือก Role' }">
            <dxi-validation-rule type="required"></dxi-validation-rule>
          </dxi-item>
        </dxi-item>

        <dxi-item itemType="group" caption="ตั้งค่ารหัสผ่าน" [colCount]="1">
            <dxi-item itemType="simple" cssClass="password-hint">
                <div *dxTemplate>
                   <small style="color: #666; margin-bottom: 5px; display: block;">
                     * กรอกเฉพาะเมื่อต้องการเปลี่ยนรหัสผ่านใหม่เท่านั้น
                   </small>
                </div>
            </dxi-item>

            <dxi-item dataField="password"
                [label]="{ text: 'รหัสผ่านใหม่' }"
                [editorOptions]="{ mode: 'password', placeholder: 'ระบุรหัสผ่านใหม่...' }">
            </dxi-item>
        </dxi-item>
      </dxo-form>
    </dxo-editing>

    <dxi-column dataField="employeeId" caption="รหัสพนักงาน">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>

    <dxi-column dataField="fullName" caption="ชื่อ-นามสกุล">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>

    <dxi-column dataField="email" caption="Email">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>

    <dxi-column dataField="role" caption="Role" editorType="dxSelectBox"
      [editorOptions]="{ items: roles }">
      <dxi-validation-rule type="required"></dxi-validation-rule>
    </dxi-column>

    <dxi-column dataField="password" [visible]="false"></dxi-column>
    
  </dx-data-grid>
</div>
