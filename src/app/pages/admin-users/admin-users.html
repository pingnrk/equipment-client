<div class="container-fluid p-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold m-0 text-dark">
            <i class="dx-icon-group me-2"></i> User Management
        </h2>
    </div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white py-3">
            <h5 class="mb-0 text-primary fw-bold">รายชื่อผู้ใช้งานทั้งหมด (System Users)</h5>
        </div>

        <div class="card-body p-0">
            <dx-data-grid
                [dataSource]="users"
                [showBorders]="false"
                [rowAlternationEnabled]="true"
                [columnAutoWidth]="true"
                [hoverStateEnabled]="true"
                keyExpr="id"
                (onRowInserting)="onRowInserting($event)"
                (onRowUpdating)="onRowUpdating($event)"
                (onRowRemoving)="onRowRemoving($event)">

                <dxo-search-panel [visible]="true" [width]="300" placeholder="Search users..."></dxo-search-panel>
                <dxo-paging [pageSize]="10"></dxo-paging>
                <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[10, 20, 50]"></dxo-pager>

                <dxo-editing
                    mode="popup"
                    [allowUpdating]="true"
                    [allowDeleting]="true"
                    [allowAdding]="true">
                    
                    <dxo-popup title="Manage User" [showTitle]="true" [width]="600" [height]="'auto'"></dxo-popup>
                    
                    <dxo-form [colCount]="1">
                        <dxi-item itemType="group" caption="General Information">
                            <dxi-item dataField="employeeId">
                                <dxi-validation-rule type="required"></dxi-validation-rule>
                            </dxi-item>
                            <dxi-item dataField="fullName">
                                <dxi-validation-rule type="required"></dxi-validation-rule>
                            </dxi-item>
                            <dxi-item dataField="email">
                                <dxi-validation-rule type="required"></dxi-validation-rule>
                                <dxi-validation-rule type="email"></dxi-validation-rule>
                            </dxi-item>
                            <dxi-item dataField="role" editorType="dxSelectBox"
                                [editorOptions]="{ items: roles, placeholder: 'Select Role' }">
                                <dxi-validation-rule type="required"></dxi-validation-rule>
                            </dxi-item>
                        </dxi-item>

                        <dxi-item itemType="group" caption="Security">
                            <dxi-item itemType="simple">
                                <div *dxTemplate>
                                    <div class="alert alert-light border text-muted small mb-0">
                                        <i class="dx-icon-info me-1"></i> 
                                        Leave blank if you don't want to change the password.
                                    </div>
                                </div>
                            </dxi-item>

                            <dxi-item dataField="password"
                                [editorOptions]="{ mode: 'password', placeholder: 'New Password (Optional)', stylingMode: 'outlined' }">
                            </dxi-item>
                        </dxi-item>
                    </dxo-form>
                </dxo-editing>

                <dxi-column dataField="employeeId" caption="ID" [width]="120"></dxi-column>
                <dxi-column dataField="fullName" caption="Full Name"></dxi-column>
                <dxi-column dataField="email" caption="Email"></dxi-column>
                
                <dxi-column dataField="role" caption="Role" alignment="center" cellTemplate="roleCell" [width]="120"></dxi-column>
                <div *dxTemplate="let d of 'roleCell'">
                    <span class="badge rounded-pill" 
                        [ngClass]="{
                            'bg-primary': d.value === 'Admin',
                            'bg-secondary': d.value !== 'Admin'
                        }">
                        {{ d.value }}
                    </span>
                </div>

                <dxi-column dataField="password" [visible]="false"></dxi-column>

            </dx-data-grid>
        </div>
    </div>
</div>
