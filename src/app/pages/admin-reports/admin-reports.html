<div class="page-container">
  <div class="page-header-row">
    <h2 class="page-title">📊 Export Reports</h2>
  </div>
  <dx-data-grid
    id="reportGrid"
    [dataSource]="reportData"
    [showBorders]="true"
    [columnAutoWidth]="true"
    [rowAlternationEnabled]="true"
    [hoverStateEnabled]="true"
    (onExporting)="onExporting($event)"
  >
    <dxo-export
      [enabled]="true"
      [allowExportSelectedData]="true"
      [formats]="['xlsx']"
    ></dxo-export>

    <dxo-search-panel
      [visible]="true"
      [width]="300"
      placeholder="Search..."
    ></dxo-search-panel>
    <dxo-filter-row [visible]="true"></dxo-filter-row>
    <dxo-header-filter [visible]="true"></dxo-header-filter>

    <dxo-group-panel
      [visible]="true"
      placeholder="Drag columns here to group"
    ></dxo-group-panel>
    <dxo-grouping [autoExpandAll]="true"></dxo-grouping>

    <dxo-paging [pageSize]="20"></dxo-paging>
    <dxo-pager
      [showPageSizeSelector]="true"
      [allowedPageSizes]="[20, 50, 100]"
    ></dxo-pager>

    <dxi-column
      dataField="requestDate"
      dataType="date"
      format="dd/MM/yyyy HH:mm"
      caption="Requested Date"
      sortOrder="desc"
    ></dxi-column>

    <dxi-column dataField="user.fullName" caption="Requested By">
      <dxi-column dataField="user.employeeId" caption="Emp ID"></dxi-column>
      <dxi-column dataField="user.fullName" caption="Name"></dxi-column>
    </dxi-column>

    <dxi-column
      dataField="itemsText"
      caption="Items List"
      [width]="350"
      cellTemplate="itemsCell"
    ></dxi-column>
    <div *dxTemplate="let d of 'itemsCell'">
      <span class="text-wrap" style="font-size: 0.9rem;">{{ d.value }}</span>
    </div>

    <dxi-column
      dataField="startDate"
      dataType="date"
      format="dd/MM/yyyy"
      caption="Borrow Date"
      alignment="center"
    ></dxi-column>
    <dxi-column
      dataField="endDate"
      dataType="date"
      format="dd/MM/yyyy"
      caption="Return Date"
      alignment="center"
    ></dxi-column>

    <dxi-column
      dataField="statusText"
      caption="Status"
      [groupIndex]="0"
    ></dxi-column>
  </dx-data-grid>
</div>
