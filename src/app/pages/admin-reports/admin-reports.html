<div class="page-container">
  <div class="page-header-row">
    <h2 class="page-title">📊 ออกรายงาน (Export Reports)</h2>
  </div>

  <div class="bg-white p-3 p-md-4 rounded-4 shadow-sm w-100" style="box-sizing: border-box; overflow-x: auto;">

    <dx-data-grid
      id="reportGrid"
      [dataSource]="reportData"
      [showBorders]="true"
      [columnAutoWidth]="true"
      [rowAlternationEnabled]="true"
      [hoverStateEnabled]="true"
      (onExporting)="onExporting($event)"
    >
      <dxo-export [enabled]="true" [allowExportSelectedData]="true" [formats]="['xlsx']"></dxo-export>

      <dxo-search-panel [visible]="true" [width]="300" placeholder="ค้นหาข้อมูล..."></dxo-search-panel>
      <dxo-filter-row [visible]="true"></dxo-filter-row>
      <dxo-header-filter [visible]="true"></dxo-header-filter>

      <dxo-group-panel [visible]="true" placeholder="ลากหัวข้อคอลัมน์มาวางที่นี่เพื่อจัดกลุ่ม"></dxo-group-panel>
      <dxo-grouping [autoExpandAll]="true"></dxo-grouping>

      <dxo-paging [pageSize]="20"></dxo-paging>
      <dxo-pager [showPageSizeSelector]="true" [allowedPageSizes]="[20, 50, 100]"></dxo-pager>

      <dxi-column dataField="requestDate" dataType="date" format="dd/MM/yyyy HH:mm" caption="วันที่ทำรายการ" sortOrder="desc" alignment="center"></dxi-column>

      <dxi-column dataField="user.fullName" caption="ข้อมูลผู้ยืม" alignment="center">
        <dxi-column dataField="user.employeeId" caption="รหัสพนักงาน" alignment="center"></dxi-column>
        <dxi-column dataField="user.fullName" caption="ชื่อ-นามสกุล"></dxi-column>
      </dxi-column>

      <dxi-column dataField="itemsText" caption="รายการครุภัณฑ์" [width]="350" cellTemplate="itemsCell"></dxi-column>

      <div *dxTemplate="let d of 'itemsCell'">
        <span class="text-wrap" style="font-size: 0.9rem;">{{ d.value }}</span>
      </div>

      <dxi-column dataField="startDate" dataType="date" format="dd/MM/yyyy" caption="วันที่ยืม" alignment="center"></dxi-column>
      <dxi-column dataField="endDate" dataType="date" format="dd/MM/yyyy" caption="กำหนดคืน" alignment="center"></dxi-column>

      <dxi-column dataField="statusText" caption="สถานะ" [groupIndex]="0"></dxi-column>
    </dx-data-grid>

  </div>
</div>
