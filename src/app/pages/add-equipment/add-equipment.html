<div class="container">
  <div class="form-card">
    <h2>Add New Equipment</h2>
    
    <form (submit)="onSubmit($event)">
      <dx-form
        [formData]="equipmentData"
        [showValidationSummary]="true"
        validationGroup="equipmentGroup">

        <dxi-item itemType="group" caption="Basic Info" [colCount]="2">
          
          <dxi-item dataField="code">
            <dxi-validation-rule type="required" message="Code is required"></dxi-validation-rule>
          </dxi-item>

          <dxi-item dataField="name">
            <dxi-validation-rule type="required" message="Name is required"></dxi-validation-rule>
          </dxi-item>

          <dxi-item dataField="categoryId" editorType="dxSelectBox"
            [editorOptions]="{ 
              dataSource: categories, 
              displayExpr: 'name', 
              valueExpr: 'id',
              placeholder: 'Select Category'
            }">
            <dxi-validation-rule type="required" message="Category is required"></dxi-validation-rule>
          </dxi-item>

          <dxi-item dataField="stock" editorType="dxNumberBox" 
            [editorOptions]="{ min: 0, showSpinButtons: true }">
            <dxi-validation-rule type="required" message="Stock is required"></dxi-validation-rule>
          </dxi-item>

        </dxi-item>

        <dxi-item itemType="group" caption="Details">
          
          <dxi-item dataField="isUnlimited" editorType="dxCheckBox" 
            [editorOptions]="{ text: 'Unlimited Stock' }">
          </dxi-item>

          <dxi-item dataField="description" editorType="dxTextArea" 
            [editorOptions]="{ height: 100 }">
          </dxi-item>

          <dxi-item>
            <div class="file-upload-section">
              <label>Equipment Image</label>
              <dx-file-uploader
                selectButtonText="Select Image"
                labelText=""
                accept="image/*"
                uploadMode="useForm"
                (onValueChanged)="onFileSelected($event)">
              </dx-file-uploader>
            </div>
          </dxi-item>

        </dxi-item>

        <dxi-item itemType="button" 
          [buttonOptions]="{
            text: isLoading ? 'Saving...' : 'Save Equipment',
            type: 'default',
            useSubmitBehavior: true,
            width: '100%',
            disabled: isLoading
          }">
        </dxi-item>

      </dx-form>
    </form>
  </div>
</div>
