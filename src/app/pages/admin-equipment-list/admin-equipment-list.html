<div class="page-container">
  <div class="page-header-row d-flex justify-content-between align-items-center mb-3 gap-2">
    <h2 class="page-title mb-0 fs-4 fs-md-3">
      <span class="d-none d-md-inline">📦 จัดการครุภัณฑ์ (Inventory Management)</span>
      <span class="d-inline d-md-none">📦 จัดการครุภัณฑ์</span>
    </h2>

    <button
      class="btn btn-primary rounded-3 shadow-sm d-flex align-items-center text-nowrap"
      style="padding: 0.5rem 0.75rem"
      (click)="goToAdd()"
    >
      <i class="dx-icon-add fs-5"></i>
      <span class="ms-1 d-none d-sm-inline fw-bold">เพิ่มครุภัณฑ์ใหม่</span>
    </button>
  </div>

  <div
    class="bg-white p-3 p-md-4 rounded-4 shadow-sm w-100 overflow-hidden"
    style="box-sizing: border-box"
  >
    <dx-data-grid
      id="gridContainer"
      class="custom-grid"
      [dataSource]="dataSource"
      [remoteOperations]="true"
      [showBorders]="true"
      [rowAlternationEnabled]="true"
      [columnAutoWidth]="true"
      [hoverStateEnabled]="true"
    >
      <dxo-search-panel
        [visible]="true"
        [width]="300"
        placeholder="ค้นหาครุภัณฑ์..."
      ></dxo-search-panel>

      <dxo-paging [pageSize]="10"></dxo-paging>
      <dxo-pager
        [showPageSizeSelector]="true"
        [allowedPageSizes]="[10, 20, 50]"
        [showInfo]="true"
      ></dxo-pager>

      <dxi-column
        caption="รูปภาพ"
        [width]="100"
        cellTemplate="imageCell"
        [allowFiltering]="false"
        [allowSorting]="false"
        alignment="center"
      ></dxi-column>
      <div *dxTemplate="let d of 'imageCell'">
        <img
          [src]="getFullImageUrl(d.data.imageUrl)"
          alt="Item"
          class="rounded-3 border shadow-sm"
          style="width: 50px; height: 50px; object-fit: cover"
          onerror="this.src = 'assets/no-image.png'"
        />
      </div>

      <dxi-column dataField="code" caption="รหัส" [width]="120" alignment="center"></dxi-column>
      <dxi-column dataField="name" caption="ชื่อครุภัณฑ์"></dxi-column>

      <dxi-column
        dataField="stock"
        caption="คงเหลือ"
        [width]="100"
        alignment="center"
        cellTemplate="stockCell"
      ></dxi-column>
      <div *dxTemplate="let d of 'stockCell'">
        <span class="fw-bold" [class.text-danger]="d.value === 0">{{ d.value }}</span>
      </div>

      <dxi-column
        dataField="status"
        caption="สถานะ"
        [width]="140"
        cellTemplate="statusCell"
        alignment="center"
      ></dxi-column>
      <div *dxTemplate="let d of 'statusCell'">
        <span
          class="badge rounded-pill px-3 py-2"
          [ngClass]="{
            'text-bg-success': d.value === 1,
            'text-bg-danger': d.value === 2,
            'text-bg-secondary': d.value > 2,
          }"
        >
          {{ d.value === 1 ? 'พร้อมใช้งาน' : d.value === 2 ? 'ถูกยืม' : 'ซ่อมบำรุง' }}
        </span>
      </div>

      <dxi-column type="buttons" caption="จัดการ" [width]="120" [allowHiding]="false">
        <dxi-button icon="edit" hint="แก้ไข" [onClick]="onEditClick"> </dxi-button>
        <dxi-button icon="trash" hint="ลบ" [onClick]="onDeleteClick"> </dxi-button>
      </dxi-column>
    </dx-data-grid>
  </div>
</div>
