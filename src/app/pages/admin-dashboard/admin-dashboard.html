<div class="page-container">
  <div class="page-header-row">
    <h2 class="page-title">📊 แดชบอร์ดผู้ดูแลระบบ (Admin Dashboard)</h2>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="card summary-card shadow-sm border-0 h-100 rounded-4">
        <div class="card-body d-flex align-items-center p-4">
          <div class="icon-circle bg-primary-subtle text-primary me-4">
            <i class="dx-icon-doc fs-2"></i>
          </div>
          <div>
            <h6 class="text-muted mb-1 fw-normal">คำขอทั้งหมด (Total)</h6>
            <h3 class="fw-bold m-0 text-dark">{{ summaryData.total }}</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card shadow-sm border-0 h-100 rounded-4">
        <div class="card-body d-flex align-items-center p-4">
          <div class="icon-circle bg-warning-subtle text-warning me-4">
            <i class="dx-icon-clock fs-2"></i>
          </div>
          <div>
            <h6 class="text-muted mb-1 fw-normal">รออนุมัติ (Pending)</h6>
            <h3 class="fw-bold m-0 text-dark">{{ summaryData.pending }}</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card summary-card shadow-sm border-0 h-100 rounded-4">
        <div class="card-body d-flex align-items-center p-4">
          <div class="icon-circle bg-success-subtle text-success me-4">
            <i class="dx-icon-check fs-2"></i>
          </div>
          <div>
            <h6 class="text-muted mb-1 fw-normal">กำลังใช้งาน (Active)</h6>
            <h3 class="fw-bold m-0 text-dark">{{ summaryData.approved }}</h3>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="card-header bg-white py-3 px-4 border-bottom">
          <h5 class="mb-0 text-dark fw-bold">
            <i class="dx-icon-pie text-primary me-2"></i> ภาพรวมสถานะคำขอ
          </h5>
        </div>
        <div class="card-body p-4">
          <dx-pie-chart [dataSource]="chartData" type="doughnut" palette="Material">
            <dxo-size [height]="350"></dxo-size>

            <dxi-series argumentField="status" valueField="count">
              <dxo-label
                [visible]="true"
                position="columns"
                [customizeText]="customizeLabel"
              >
                <dxo-font [size]="14" [weight]="600" color="#4b5563"></dxo-font>
                <dxo-connector [visible]="true" color="#cbd5e1"></dxo-connector>
              </dxo-label>
            </dxi-series>

            <dxo-legend
              [visible]="true"
              horizontalAlignment="center"
              verticalAlignment="bottom"
            ></dxo-legend>
            <dxo-export [enabled]="true"></dxo-export>
          </dx-pie-chart>
        </div>
      </div>
    </div>
  </div>
</div>
