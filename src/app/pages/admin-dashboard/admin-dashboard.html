<div class="page-container">
  <h2 class="page-title">Admin Dashboard</h2>

  <div class="dashboard-grid">
    <div class="card summary-card">
      <div class="card-icon bg-blue"><i class="dx-icon-doc"></i></div>
      <div class="card-info">
        <h3>Total Requests</h3>
        <p>{{ summaryData.total }}</p>
      </div>
    </div>

    <div class="card summary-card">
      <div class="card-icon bg-yellow"><i class="dx-icon-clock"></i></div>
      <div class="card-info">
        <h3>Pending</h3>
        <p>{{ summaryData.pending }}</p>
      </div>
    </div>

    <div class="card summary-card">
      <div class="card-icon bg-green"><i class="dx-icon-check"></i></div>
      <div class="card-info">
        <h3>Active (In Use)</h3>
        <p>{{ summaryData.approved }}</p>
      </div>
    </div>
  </div>

  <div class="chart-section">
      <dx-pie-chart
        title="Request Status Overview"

        [dataSource]="chartData"
        type="doughnut">
        <dxi-series argumentField="status" valueField="count">
          <dxo-label [visible]="true" position="columns">
            <dxo-connector [visible]="true"></dxo-connector>
          </dxo-label>
        </dxi-series>
        <dxo-legend [visible]="true" horizontalAlignment="center" verticalAlignment="bottom"></dxo-legend>
      </dx-pie-chart>
  </div>
</div>
