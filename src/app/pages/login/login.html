<div class="container-fluid vh-100">
  <div class="row h-100">

    <div
      class="col-lg-7 d-none d-lg-flex flex-column align-items-center justify-content-center bg-primary text-white p-5 position-relative overflow-hidden">
      <div class="position-absolute bg-white opacity-10 rounded-circle"
        style="width: 300px; height: 300px; top: -50px; left: -50px;"></div>
      <div class="position-absolute bg-white opacity-10 rounded-circle"
        style="width: 200px; height: 200px; bottom: 50px; right: 50px;"></div>

      <div class="z-1 text-center">
        <div
          class="bg-white text-primary rounded-circle d-flex align-items-center justify-content-center mx-auto mb-4 shadow-lg"
          style="width: 80px; height: 80px;">
          <i class="dx-icon-box fs-1"></i>
        </div>
        <h2 class="fw-bold mb-3">ระบบยืมครุภัณฑ์ (Equipment Client)</h2>
        <p class="lead opacity-75">
          ยินดีต้อนรับ<br>
          กรุณาเข้าสู่ระบบเพื่อทำรายการ
        </p>
      </div>
    </div>

    <div class="col-lg-5 d-flex align-items-center justify-content-center bg-white">
      <div class="w-100 p-4 p-md-5" style="max-width: 450px;">
        <div class="mb-5 text-center text-lg-start">
          <h2 class="fw-bold text-dark mb-2">เข้าสู่ระบบ</h2>
        </div>

        <form (submit)="onSubmit($event)">
          <dx-form [formData]="formData" [labelLocation]="'top'" [showColonAfterLabel]="false">
            <dxi-item dataField="employeeId"
              [editorOptions]="{ placeholder: 'เช่น EMP001', stylingMode: 'outlined', height: '50px' }">
              <dxi-validation-rule type="required" message="กรุณากรอกรหัสพนักงาน"></dxi-validation-rule>
              <dxo-label text="รหัสพนักงาน"></dxo-label>
            </dxi-item>

            <dxi-item dataField="password"
              [editorOptions]="{ placeholder: '••••••••', mode: 'password', stylingMode: 'outlined', height: '50px' }">
              <dxi-validation-rule type="required" message="กรุณากรอกรหัสผ่าน"></dxi-validation-rule>
              <dxo-label text="รหัสผ่าน"></dxo-label>
            </dxi-item>
          </dx-form>

          <div class="d-flex justify-content-end mt-2 mb-4">
          </div>

          <dx-button width="100%" height="50px" type="default" stylingMode="contained" [useSubmitBehavior]="true"
            [text]="isLoading ? 'เข้าสู่ระบบ':'กำลังตรวจสอบข้อมูล...'" class="fw-bold fs-6 shadow-sm">
          </dx-button>
        </form>

        <div class="text-center mt-5">
          <p class="text-muted small">
            ยังไม่มีบัญชีใช่หรือไม่?
            <a (click)="goToRegister()" class="text-primary fw-bold text-decoration-none" style="cursor: pointer;">
              สมัครสมาชิก
            </a>
          </p>
        </div>

      </div>
    </div>
  </div>
</div>
