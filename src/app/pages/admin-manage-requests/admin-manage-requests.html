<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-primary">
            <i [class]="pageType === 'approve' ? 'dx-icon-check' : 'dx-icon-revert'"></i>
            {{ pageType === 'approve' ? 'Approve Requests' : 'Return Equipment' }}
        </h2>
        <button class="btn btn-outline-secondary btn-sm" (click)="loadData()">
            <i class="dx-icon-refresh"></i> Refresh
        </button>
    </div>

    <dx-data-grid
        [dataSource]="requests"
        [showBorders]="true"
        [rowAlternationEnabled]="true"
        [columnAutoWidth]="true">

        <dxo-filter-row [visible]="true"></dxo-filter-row>
        <dxo-search-panel [visible]="true"></dxo-search-panel>
        <dxo-paging [pageSize]="10"></dxo-paging>

        <!-- Columns -->
        <dxi-column dataField="user.fullName" caption="User"></dxi-column>
        <!-- สมมติว่า items เป็น array เอาตัวแรกมาโชว์ -->
        <dxi-column dataField="items[0].equipment.name" caption="Equipment"></dxi-column>
        <dxi-column dataField="startDate" caption="Start Date" dataType="date"></dxi-column>
        <dxi-column dataField="endDate" caption="Due Date" dataType="date"></dxi-column>

        <!-- Actions Column -->
        <dxi-column caption="Actions" cellTemplate="actionTemplate" [width]="160" alignment="center"></dxi-column>
        <div *dxTemplate="let data of 'actionTemplate'">

            <!-- 🟢 ถ้าเป็นหน้า Approve ให้โชว์ปุ่ม Approve/Reject -->
            <ng-container *ngIf="pageType === 'approve'">
                <dx-button
                    icon="check"
                    type="success"
                    stylingMode="contained"
                    (onClick)="onApprove(data.data.id)"
                    hint="Approve">
                </dx-button>
                <dx-button
                    icon="close"
                    type="danger"
                    stylingMode="contained"
                    class="ms-2"
                    (onClick)="onReject(data.data.id)"
                    hint="Reject">
                </dx-button>
            </ng-container>

            <!-- 🔵 ถ้าเป็นหน้า Return ให้โชว์ปุ่ม Return อย่างเดียว -->
            <ng-container *ngIf="pageType === 'return'">
                <dx-button
                    text="Return"
                    icon="revert"
                    type="default"
                    stylingMode="contained"
                    (onClick)="onReturn(data.data.id)">
                </dx-button>
            </ng-container>

        </div>
    </dx-data-grid>
</div>
