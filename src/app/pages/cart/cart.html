<div class="page-container">
  <div class="page-header-row">
    <h2 class="page-title">
      📝 ยื่นคำขอยืมครุภัณฑ์ (Confirm Borrowing)
    </h2>
  </div>

  <div class="row g-4">
    <div class="col-lg-4">
      <div class="card shadow-sm border-0 rounded-4 overflow-hidden h-100">
        <div class="card-header bg-white py-3 border-bottom-0">
          <h5 class="card-title mb-0 text-primary fw-bold">
            🗓️ กำหนดวันที่ต้องการยืม
          </h5>
        </div>
        <div class="card-body pt-0">
          <dx-form [formData]="bookingData" [labelLocation]="'top'">
            <dxi-item itemType="group">
              <dxi-item dataField="startDate" editorType="dxDateBox" [editorOptions]="{
                        type: 'date',
                        displayFormat: 'dd/MM/yyyy',
                        min: minDate,
                        stylingMode: 'outlined',
                        placeholder: 'เลือกวันที่ยืม',
                        height: 48
                    }">
                <dxi-validation-rule type="required" message="กรุณาระบุวันที่เริ่มยืม"></dxi-validation-rule>
                <dxo-label text="วันที่ยืม (Start Date)"></dxo-label>
              </dxi-item>

              <dxi-item dataField="endDate" editorType="dxDateBox" [editorOptions]="{
                        type: 'date',
                        displayFormat: 'dd/MM/yyyy',
                        min: minDate,
                        stylingMode: 'outlined',
                        placeholder: 'เลือกวันที่คืน',
                        height: 48
                    }">
                <dxi-validation-rule type="required" message="กรุณาระบุวันที่คืน"></dxi-validation-rule>
                <dxo-label text="วันที่คืน (End Date)"></dxo-label>
              </dxi-item>
            </dxi-item>
          </dx-form>

          <div class="alert alert-warning border-0 bg-warning-subtle mt-4 mb-0 text-dark small rounded-3">
            <span>⚠️</span> ตรวจสอบวันที่ยืม-คืนให้ถูกต้องก่อนกดยืนยันรายการ
          </div>
        </div>
      </div>
    </div>

    <div class="col-lg-8">
      <div class="card shadow-sm border-0 rounded-4 overflow-hidden h-100">
        <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center border-bottom-0">
          <h5 class="card-title mb-0 text-primary fw-bold">
            📦 รายการที่เลือกไว้
          </h5>
          <span class="badge bg-primary rounded-pill px-3">{{ selectedItems.length }} รายการ</span>
        </div>

        <div class="card-body p-0">
          <dx-data-grid [dataSource]="selectedItems" [showBorders]="false" [columnAutoWidth]="true"
            [rowAlternationEnabled]="true" [hoverStateEnabled]="true" class="custom-grid-cart">

            <dxo-editing mode="cell" [allowUpdating]="true" [allowDeleting]="true"></dxo-editing>

            <dxi-column dataField="code" caption="รหัส" [allowEditing]="false" [width]="100"
              alignment="center"></dxi-column>

            <dxi-column caption="รูป" [width]="80" cellTemplate="imgTpl" [allowEditing]="false"
              alignment="center"></dxi-column>
            <div *dxTemplate="let d of 'imgTpl'">
              <img [src]="getFullImageUrl(d.data.imageUrl)" class="rounded-3 border"
                style="width: 45px; height: 45px; object-fit: cover;">
            </div>

            <dxi-column dataField="name" caption="ชื่อรายการ" [allowEditing]="false"></dxi-column>

            <dxi-column dataField="quantityRequest" caption="จำนวนยืม" dataType="number" [width]="100"
              alignment="center" cssClass="editable-cell">
              <dxi-validation-rule type="required"></dxi-validation-rule>
              <dxi-validation-rule type="range" [min]="1" message="อย่างน้อย 1"></dxi-validation-rule>
            </dxi-column>

            <dxi-column type="buttons" [width]="60">
              <dxi-button name="delete" icon="trash"></dxi-button>
            </dxi-column>
          </dx-data-grid>
        </div>

        <div class="card-footer bg-light py-3 border-top-0 d-flex justify-content-between align-items-center">
          <div class="text-muted small">
            💡 ดับเบิลคลิกที่ช่อง <b>"จำนวนยืม"</b> เพื่อแก้ไข
          </div>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-secondary px-4 rounded-3" (click)="goBack()">
              ยกเลิก
            </button>
            <button class="btn btn-primary px-4 rounded-3 shadow-sm" (click)="onSubmit()">
              <i class="dx-icon-check me-2"></i> ยืนยันคำขอ
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
